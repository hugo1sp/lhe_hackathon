<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4f0">
  <title>Migrai · Anna’s app</title>
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../product.css"><style>.mobile-sync{display:none!important}.head{padding-right:0!important}.head h1{font-size:25px}.banner{display:grid!important;top:12px!important;z-index:90}.banner .nh button{font-size:21px;padding:0 4px;line-height:1}.banner small{display:block;margin-top:5px;color:var(--brand);font-weight:600}.banner:not(.on){pointer-events:none}.banner.on{pointer-events:auto}.answer-history{display:flex;gap:20px;padding:10px 0;font-size:14px;border-bottom:1px solid var(--line)}.answer-history span{color:var(--ink-3)}</style>
</head>
<body>
<div id="stage">
  <aside class="product-sidebar">
    <a class="product-brand" href="./"><img src="../logo.svg" alt="">Migrai</a>
    <button class="product-person" data-act="profile"><span>A</span><div><b>Anna</b><small>Example profile · age 23</small></div></button>
    <nav class="product-nav" aria-label="App navigation">
      <button class="side-link on" data-act="goto" data-tab="today">Today</button>
      <button class="side-link" data-act="goto" data-tab="history">History</button>
      <button class="side-link" data-act="goto" data-tab="checkin">Check-in<span id="sidebar-badge"></span></button>
    </nav>
    <section class="product-watch"><span class="product-label">EXAMPLE WATCH</span><b id="watch-date"></b><p id="watch-history"></p><button class="sync-button" data-act="nextDay">Sync next day</button></section>
    <div class="product-bottom"><span id="model-mode">Model forecasts</span><span>Simulated data</span><button data-act="reset">Reset example</button></div>
    <div id="picker" hidden></div><span id="aboutRate" hidden></span>
  </aside>
  <div class="device">
    <div class="phone" id="phone"><div class="screen" id="screen">
      <div class="statusbar" hidden><span id="sbTime"></span></div>
      <div class="banner" id="banner" data-act="banner"></div>
      <main class="views" id="views" aria-label="Migrai app"></main>
      <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="scrim" id="scrim" data-act="closeSheet"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div></section>
    </div></div>
  </div>
</div>
<button class="mobile-sync" data-act="nextDay" aria-label="Sync next example day">Sync watch</button>
<button id="mpick" hidden></button><div id="mpop" hidden></div><div id="printReport"></div>
<script src="../anna_data.js"></script><script src="../bootstrap.js"></script><script src="../app.js"></script><script src="../product.js"></script>
<script src="../embedded.js"></script></body>
</html>
