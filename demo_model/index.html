<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follow Anna · Migrai</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="scenario.css"></head>
<body><div class="demo-shell">
<header class="demo-top"><div class="demo-brand"><img src="logo.svg" alt="">Migrai <span>Follow Anna</span></div><div class="demo-controls"><span id="mode">Model forecasts</span><button id="play">Pause</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4" class="on">4×</button><button data-speed="8">8×</button><button id="restart">Restart</button></div></header>
<main class="demo-main"><section class="data-side">
<div class="scene-wrap"><canvas id="scene"></canvas><div class="scene-hud"><strong id="clock">06:00</strong><span id="scene-day"></span></div></div>
<section class="data-card"><div class="card-heading"><h2>Anna’s watch</h2><span id="sync-label">Syncing</span></div><div id="watch-values" class="watch-values"></div><div id="signal-chart"></div></section>
<section class="data-card"><div class="card-heading"><h2>Why this forecast?</h2><strong id="forecast-value"></strong></div><div id="effects"></div></section>
<div class="demo-status" id="demo-status" role="status">Watch data, forecasts and two quick questions.</div>
<div class="timeline" id="timeline"></div>
</section>
<section class="mobile-side" aria-label="Anna’s mobile app"><div class="mobile-frame"><iframe id="anna-app" src="mobile/index.html?embedded&day=169" title="Anna’s Migrai app"></iframe></div><span class="mobile-caption">Anna’s app · fully interactive</span></section></main>
<footer>Real model forecasts · Simulated watch data · Intraday timing illustrative</footer>
</div><script src="anna_data.js"></script><script src="scenario-data.js"></script><script src="scene.js"></script><script src="scenario.js"></script></body></html>
