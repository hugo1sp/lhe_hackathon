# On every push to main: run the full pipeline (./run.sh) and publish docs/ to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./run.sh
      # Static previews: the Migrai app at /migrai and the "A week with Anna" prototype at /followanna
      - run: |
          mkdir -p docs/migrai docs/followanna
          cp app/*.html app/*.js app/*.css app/*.svg docs/migrai/
          cp prototype/*.html prototype/*.js docs/followanna/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
