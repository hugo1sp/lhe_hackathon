# On every push to main: run the full pipeline (./run.sh) and publish docs/ to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./run.sh
      # Static previews: the Migrai app at /migrai and the "A week with Anna" prototype at /followanna.
      # The prototype is also the main page; the forecast page moves to /forecast.html.
      - run: |
          .venv/bin/python demo_model/build_data.py
          mkdir -p docs/followanna-model
          mkdir -p docs/followanna-model/mobile
          cp demo_model/*.html demo_model/*.js demo_model/*.css demo_model/*.svg docs/followanna-model/
          cp demo_model/mobile/index.html docs/followanna-model/mobile/
          mkdir -p docs/migrai docs/followanna
          cp app/*.html app/*.js app/*.css app/*.svg docs/migrai/
          cp prototype/*.html prototype/*.js docs/followanna/
          mv docs/index.html docs/forecast.html
          cp prototype/*.html prototype/*.js docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for Pages artifact metadata
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(15):
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  artifacts = json.load(response)["artifacts"]
              if any(artifact["name"] == "github-pages" for artifact in artifacts):
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Pages artifact metadata is not available yet")
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
